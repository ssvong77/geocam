<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPS Cam Studio - WebintoApp</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        #camera-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #video-element {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .overlay-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            pointer-events: none;
        }
        .interactive-panel {
            pointer-events: auto;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .label-custom-title {
            color: #38bdf8;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        .form-control-custom {
            background-color: rgba(255, 255, 255, 0.9) !important;
            border: none;
            color: #0f172a !important;
            font-weight: 500;
            border-radius: 10px;
        }
        .form-control-custom:focus {
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.4);
            background-color: #fff !important;
        }
        .btn-capture {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: #ffffff;
            border: 4px solid #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .btn-capture:active {
            transform: scale(0.92);
            background: #e2e8f0;
        }
        .badge-gps {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #e2e8f0;
            font-size: 0.75rem;
            padding: 6px 12px;
            border-radius: 20px;
            backdrop-filter: blur(6px);
        }
        #canvas-output {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Visor de Cámara en Pantalla Completa -->
    <div id="camera-container">
        <video id="video-element" autoplay playsinline muted></video>
    </div>

    <!-- Canvas Oculto para Procesar la Imagen Estampada -->
    <canvas id="canvas-output"></canvas>

    <!-- Interfaz de Usuario Superpuesta (UI) -->
    <div class="overlay-ui">
        
        <!-- Estado de GPS Superior -->
        <div class="d-flex justify-content-between align-items-center w-100">
            <div id="gps-status" class="badge-gps">
                <i class="bi bi-geo-alt-fill text-danger me-1"></i> Buscando GPS...
            </div>
            <button id="btn-switch-camera" class="badge-gps border-0" style="cursor: pointer;">
                <i class="bi bi-camera-reels-fill text-info me-1"></i> Cambiar Cámara
            </button>
        </div>

        <!-- Panel Inferior: Solo Línea 1 (Información / Descripción) + Botón Disparador -->
        <div class="interactive-panel mb-2">
            <div class="mb-3">
                <label for="input-info" class="form-label label-custom-title mb-1">
                    <i class="bi bi-pencil-square me-1"></i> Información / Descripción (Línea 1):
                </label>
                <input type="text" id="input-info" class="form-control form-control-custom" placeholder="Ej: Auditoría de obra - Sector Norte">
            </div>

            <div class="d-flex justify-content-center align-items-center">
                <button id="btn-take-photo" class="btn-capture" title="Tomar Foto">
                    <i class="bi bi-camera-fill text-dark fs-3"></i>
                </button>
            </div>
        </div>

    </div>

    <!-- Modal de Previsualización y Descarga -->
    <div class="modal fade" id="previewModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered modal-fullscreen-sm-down">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title"><i class="bi bi-image text-info me-2"></i> Foto Estampada</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center p-2">
                    <img id="preview-image" src="" alt="Foto Capturada" class="img-fluid rounded border border-secondary shadow" style="max-height: 65vh;">
                </div>
                <div class="modal-footer border-secondary justify-content-between">
                    <button type="button" class="btn btn-outline-light px-4" data-bs-dismiss="modal">
                        <i class="bi bi-arrow-left me-1"></i> Repetir
                    </button>
                    <a id="btn-download" href="#" class="btn btn-info text-dark fw-bold px-4">
                        <i class="bi bi-download me-1"></i> Descargar Foto
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let videoStream = null;
        let currentFacingMode = 'environment';
        let currentGPSData = {
            lat: 0,
            lng: 0,
            speed: 0,
            hasFix: false
        };

        const videoElement = document.getElementById('video-element');
        const gpsStatus = document.getElementById('gps-status');
        const inputInfo = document.getElementById('input-info');
        const btnTakephoto = document.getElementById('btn-take-photo');
        const btnSwitchCamera = document.getElementById('btn-switch-camera');
        const canvasOutput = document.getElementById('canvas-output');
        const previewModal = new bootstrap.Modal(document.getElementById('previewModal'));
        const previewImage = document.getElementById('preview-image');
        const btnDownload = document.getElementById('btn-download');

        window.addEventListener('DOMContentLoaded', () => {
            const savedInfo = localStorage.getItem('gps_cam_info');
            if (savedInfo) {
                inputInfo.value = savedInfo;
            }
            initCamera();
            initGPS();
        });

        inputInfo.addEventListener('input', () => {
            localStorage.setItem('gps_cam_info', inputInfo.value);
        });

        async function initCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    facingMode: currentFacingMode,
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                },
                audio: false
            };

            try {
                videoStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = videoStream;
                videoElement.play();
            } catch (error) {
                console.error("Error al acceder a la cámara:", error);
                alert("No se pudo acceder a la cámara. Asegúrese de otorgar los permisos necesarios.");
            }
        }

        btnSwitchCamera.addEventListener('click', () => {
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            initCamera();
        });

        function initGPS() {
            if ('geolocation' in navigator) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        currentGPSData.lat = position.coords.latitude;
                        currentGPSData.lng = position.coords.longitude;
                        currentGPSData.speed = position.coords.speed !== null && position.coords.speed >= 0 
                            ? position.coords.speed * 3.6 
                            : 0;
                        currentGPSData.hasFix = true;

                        gpsStatus.innerHTML = `<i class="bi bi-geo-alt-fill text-success me-1"></i> GPS Conectado (${currentGPSData.lat.toFixed(4)}, ${currentGPSData.lng.toFixed(4)})`;
                    },
                    (error) => {
                        console.warn("Error de GPS:", error.message);
                        gpsStatus.innerHTML = `<i class="bi bi-exclamation-triangle-fill text-warning me-1"></i> Sin señal GPS precisa`;
                        currentGPSData.hasFix = false;
                    },
                    {
                        enableHighAccuracy: true,
                        maximumAge: 0,
                        timeout: 10000
                    }
                );
            } else {
                gpsStatus.innerHTML = `<i class="bi bi-x-circle-fill text-danger me-1"></i> GPS no soportado`;
            }
        }

        function getFormattedDate() {
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            return `${day}/${month}/${year}`;
        }

        function getFormattedTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            return `${hours}:${minutes}:${seconds}`;
        }

        // Tomar Foto y Estampar en 2 Columnas con Fuente Ampliada
        btnTakephoto.addEventListener('click', () => {
            if (!videoElement.videoWidth || !videoElement.videoHeight) {
                alert("La cámara aún no está lista.");
                return;
            }

            canvasOutput.width = videoElement.videoWidth;
            canvasOutput.height = videoElement.videoHeight;
            const ctx = canvasOutput.getContext('2d');

            // 1. Dibujar fotograma de la cámara
            ctx.drawImage(videoElement, 0, 0, canvasOutput.width, canvasOutput.height);

            // Preparar textos
            const infoText = inputInfo.value.trim() || "Sin descripción";
            const dateText = `Fecha: ${getFormattedDate()}`;
            const timeText = `Hora: ${getFormattedTime()}`;
            const speedText = `Velocidad: ${currentGPSData.speed.toFixed(1)} km/h`;
            const latText = `Lat: ${currentGPSData.hasFix ? currentGPSData.lat.toFixed(6) : 'N/A'}`;
            const lngText = `Lng: ${currentGPSData.hasFix ? currentGPSData.lng.toFixed(6) : 'N/A'}`;

            // Configurar diseño de 2 columnas con fuente ampliada (+2 puntos)
            const baseFontSize = Math.max(20, Math.floor(canvasOutput.width / 38));
            const lineSpacing = baseFontSize * 1.5;
            const padding = baseFontSize * 1.2;
            const maxRows = 3; 
            const bannerHeight = (maxRows * lineSpacing) + (padding * 2);

            const bannerX = padding;
            const bannerY = canvasOutput.height - bannerHeight - padding;
            const bannerWidth = canvasOutput.width - (padding * 2);
            const columnWidth = bannerWidth / 2;

            // 2. Dibujar placa de fondo translúcida
            ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
            ctx.roundRect ? ctx.beginPath() || ctx.roundRect(bannerX, bannerY, bannerWidth, bannerHeight, 14) : ctx.fillRect(bannerX, bannerY, bannerWidth, bannerHeight);
            ctx.fill();

            ctx.strokeStyle = "rgba(56, 189, 248, 0.6)";
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // Configurar fuente grande
            ctx.font = `bold ${baseFontSize}px system-ui, sans-serif`;

            // --- COLUMNA IZQUIERDA (Info, Fecha, Hora) ---
            let leftX = bannerX + padding;
            let currentY = bannerY + padding + baseFontSize;

            // Fila 1: Info
            ctx.fillStyle = "#38bdf8";
            ctx.fillText(`Info: ${infoText}`, leftX, currentY);
            currentY += lineSpacing;

            // Fila 2: Fecha
            ctx.fillStyle = "#ffffff";
            ctx.fillText(dateText, leftX, currentY);
            currentY += lineSpacing;

            // Fila 3: Hora
            ctx.fillStyle = "#ffffff";
            ctx.fillText(timeText, leftX, currentY);

            // --- COLUMNA DERECHA (Velocidad, Lat, Lng) ---
            let rightX = bannerX + columnWidth + (padding * 0.5);
            currentY = bannerY + padding + baseFontSize;

            // Fila 1: Velocidad
            ctx.fillStyle = "#4ade80";
            ctx.fillText(speedText, rightX, currentY);
            currentY += lineSpacing;

            // Fila 2: Lat
            ctx.fillStyle = "#facc15";
            ctx.fillText(latText, rightX, currentY);
            currentY += lineSpacing;

            // Fila 3: Lng
            ctx.fillStyle = "#facc15";
            ctx.fillText(lngText, rightX, currentY);

            // 3. Exportar imagen y abrir previsualización
            const dataUrl = canvasOutput.toDataURL('image/jpeg', 0.92);
            previewImage.src = dataUrl;

            const timestamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0];
            const fileName = `GPS_Foto_${timestamp}.jpg`;
            btnDownload.href = dataUrl;
            btnDownload.download = fileName;

            previewModal.show();
        });
    </script>
</body>
</html>
